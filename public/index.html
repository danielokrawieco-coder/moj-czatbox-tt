<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twój Czatbox TT (Za Darmo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col">
    <header class="bg-gray-800 p-4 flex justify-between items-center border-b border-gray-700">
        <h1 class="font-bold text-red-500 text-lg">Czatbox TT</h1>
        <div class="flex gap-2">
            <input type="text" id="userInput" placeholder="Nazwa na TikTok (np. lewandowski)" class="bg-gray-700 px-3 py-1 rounded text-sm text-white focus:outline-none">
            <button onclick="connect()" class="bg-red-600 hover:bg-red-700 px-4 py-1 rounded text-sm font-bold">Połącz</button>
        </div>
    </header>

    <div class="bg-gray-800/50 p-2 text-xs flex justify-between">
        <span id="status" class="text-yellow-400">Stan: Gotowy do połączenia</span>
        <label><input type="checkbox" id="tts" checked class="accent-red-500"> Czytaj czat na głos (TTS)</label>
    </div>

    <main id="chat" class="flex-1 overflow-y-auto p-4 space-y-2"></main>

    <script>
        const socket = io();
        const chat = document.getElementById('chat');
        const status = document.getElementById('status');
        const tts = document.getElementById('tts');

        function connect() {
            const user = document.getElementById('userInput').value.trim();
            if (!user) return alert('Wpisz nazwę profilu!');
            status.innerText = "Łączenie...";
            socket.emit('connectTikTok', user);
        }

        socket.on('status', msg => status.innerText = msg);

        socket.on('chatMessage', data => {
            addMsg(data.user, data.text, 'chat');
            if (tts.checked) speak(`${data.user} pisze: ${data.text}`);
        });

        socket.on('giftEvent', data => {
            addMsg(data.user, `wysłał ${data.count}x ${data.giftName} 🎁`, 'gift');
            if (tts.checked) speak(`${data.user} wysłał prezent ${data.giftName}`);
        });

        function addMsg(user, text, type) {
            const div = document.createElement('div');
            div.className = type === 'gift' ? 'bg-red-500/10 border-l-2 border-red-500 p-2 text-sm rounded' : 'bg-gray-800 p-2 text-sm rounded border border-gray-700';
            div.innerHTML = `<b class="${type === 'gift' ? 'text-red-400' : 'text-blue-400'}">${user}:</b> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'pl-PL';
                window.speechSynthesis.speak(u);
            }
        }
    </script>
</body>
</html>
